{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl rounded-3xl border border-slate-200 bg-white p-10 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-600">Phase 2</p>
  <h1 class="mt-3 text-3xl font-bold">{{ title }}</h1>
  <p class="mt-4 text-slate-600 dark:text-slate-300">{{ message }}</p>
  <a href="/" class="mt-6 inline-flex rounded-full bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-700 dark:bg-brand-500 dark:hover:bg-brand-600">Back to home</a>
</section>
{% endblock %}
