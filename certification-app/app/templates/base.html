<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI Cert Guide{% endblock %}</title>
    <meta
      name="description"
      content="Compare AI certifications and discover which learning path fits your goals."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef6ff',
                100: '#dbeafe',
                500: '#2563eb',
                600: '#1d4ed8',
                700: '#1e3a8a'
              }
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { font-family: Inter, system-ui, sans-serif; }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
      .pill { border-radius: 9999px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; }
      .badge-level-foundational { background: #ecfdf5; color: #065f46; }
      .badge-level-associate { background: #eff6ff; color: #1d4ed8; }
      .badge-level-professional { background: #fef3c7; color: #92400e; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100">
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <a href="/" class="text-xl font-bold text-slate-900 dark:text-white">AI Cert Guide</a>
        <nav class="hidden items-center gap-6 text-sm font-medium text-slate-700 md:flex dark:text-slate-200">
          <a href="/" class="hover:text-brand-600">Certifications</a>
          <a href="/compare" class="hover:text-brand-600">Compare</a>
          <a href="/roadmaps" class="hover:text-brand-600">Roadmaps</a>
        </nav>
        <button id="theme-toggle" class="rounded-full border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800" type="button" aria-label="Toggle color theme">
          Dark mode
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <div class="mb-6 rounded-2xl border border-sky-100 bg-sky-50 px-4 py-3 text-sm text-sky-800 dark:border-sky-900 dark:bg-sky-950/40 dark:text-sky-200">
        Details change often. Always confirm pricing and exam requirements on the official site.
      </div>
      {% block content %}{% endblock %}
    </main>

    <script>
      const root = document.documentElement;
      const toggleButton = document.getElementById('theme-toggle');
      const currentTheme = localStorage.getItem('theme');
      if (currentTheme === 'dark') {
        root.classList.add('dark');
        toggleButton.textContent = 'Light mode';
      }

      toggleButton.addEventListener('click', () => {
        const isDark = root.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        toggleButton.textContent = isDark ? 'Light mode' : 'Dark mode';
      });
    </script>
  </body>
</html>
