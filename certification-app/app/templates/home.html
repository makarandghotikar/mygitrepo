{% extends 'base.html' %}
{% block title %}AI Cert Guide | Certifications{% endblock %}
{% block content %}
<section class="mb-8">
  <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
    <div>
      <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-brand-600">Career learning path</p>
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Choose the right AI certification</h1>
    </div>
    <a href="/compare" class="inline-flex items-center justify-center rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:bg-brand-500 dark:hover:bg-brand-600">
      Compare up to 3
    </a>
  </div>
</section>

<section class="mb-8 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-5">
    <label class="block xl:col-span-2">
      <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Search</span>
      <input id="search-input" type="search" placeholder="Search by name or skill" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none ring-0 transition focus:border-brand-500 focus:bg-white dark:border-slate-700 dark:bg-slate-800 dark:text-white" />
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Provider</span>
      <select id="provider-filter" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        <option value="">All providers</option>
        {% for provider in providers %}
        <option value="{{ provider }}">{{ provider }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Level</span>
      <select id="level-filter" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        <option value="">All levels</option>
        {% for level in levels %}
        <option value="{{ level }}">{{ level|title }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Focus area</span>
      <select id="focus-filter" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        <option value="">All focus areas</option>
        {% for area in focus_areas %}
        <option value="{{ area }}">{{ area|title }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="block">
      <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Max cost</span>
      <input id="max-cost" type="number" min="0" placeholder="Any budget" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white" />
    </label>

    <label class="block md:col-span-2 xl:col-span-1">
      <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Sort by</span>
      <select id="sort-filter" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        <option value="level_asc">Level</option>
        <option value="cost_asc">Cost: low to high</option>
        <option value="cost_desc">Cost: high to low</option>
      </select>
    </label>
  </div>
</section>

<section>
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-xl font-semibold">Certification catalog</h2>
    <p id="results-summary" class="text-sm text-slate-600 dark:text-slate-400">Loading certifications…</p>
  </div>
  <div id="cert-grid" class="card-grid"></div>
</section>

<script>
  const grid = document.getElementById('cert-grid');
  const summary = document.getElementById('results-summary');
  const searchInput = document.getElementById('search-input');
  const providerFilter = document.getElementById('provider-filter');
  const levelFilter = document.getElementById('level-filter');
  const focusFilter = document.getElementById('focus-filter');
  const maxCostInput = document.getElementById('max-cost');
  const sortFilter = document.getElementById('sort-filter');

  function renderCertCard(cert) {
    const levelClass = cert.level ? `badge-level-${cert.level.toLowerCase()}` : 'bg-slate-200 text-slate-700';
    return `
      <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
        <div class="mb-4 flex items-start justify-between gap-3">
          <div>
            <span class="pill inline-flex px-2.5 py-1 ${levelClass}">${cert.level ? cert.level.charAt(0).toUpperCase() + cert.level.slice(1) : 'N/A'}</span>
            <h3 class="mt-3 text-lg font-semibold leading-snug">${cert.name}</h3>
          </div>
          <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-slate-700 dark:bg-slate-800 dark:text-slate-200">${cert.provider}</span>
        </div>

        <div class="mb-4 space-y-2 text-sm text-slate-600 dark:text-slate-300">
          <p><strong>Focus:</strong> ${cert.focus_area}</p>
          <p><strong>Exam:</strong> ${cert.exam_code}</p>
          <p><strong>Cost:</strong> $${cert.cost_usd ?? 'N/A'}</p>
        </div>

        <div class="mb-4 flex flex-wrap gap-2">
          ${cert.skills_covered.slice(0, 3).map(skill => `<span class="rounded-full bg-brand-50 px-2 py-1 text-xs text-brand-700 dark:bg-brand-950 dark:text-brand-200">${skill}</span>`).join('')}
        </div>

        <div class="flex items-center justify-between pt-3">
          <a href="/certs/${cert.slug}" class="text-sm font-semibold text-brand-600 hover:text-brand-500">View details →</a>
          <span class="text-xs text-slate-500">${cert.last_verified}</span>
        </div>
      </article>
    `;
  }

  async function fetchCerts() {
    const params = new URLSearchParams();
    const searchValue = searchInput.value.trim();
    const providerValue = providerFilter.value;
    const levelValue = levelFilter.value;
    const focusValue = focusFilter.value;
    const maxCostValue = maxCostInput.value;
    const sortValue = sortFilter.value;

    if (searchValue) params.set('search', searchValue);
    if (providerValue) params.set('provider', providerValue);
    if (levelValue) params.set('level', levelValue);
    if (focusValue) params.set('focus_area', focusValue);
    if (maxCostValue) params.set('max_cost', maxCostValue);
    if (sortValue) params.set('sort', sortValue);

    const response = await fetch(`/api/certifications?${params.toString()}`);
    const data = await response.json();

    grid.innerHTML = data.length
      ? data.map(renderCertCard).join('')
      : '<div class="rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-500 dark:border-slate-700 dark:text-slate-400">No certifications match your filters.</div>';

    summary.textContent = `${data.length} certification${data.length === 1 ? '' : 's'} found`;
  }

  [searchInput, providerFilter, levelFilter, focusFilter, maxCostInput, sortFilter].forEach(input => {
    input.addEventListener('input', fetchCerts);
    input.addEventListener('change', fetchCerts);
  });

  fetchCerts();
</script>
{% endblock %}
